    let currentCategory = 'ALL';

    // Render Product Cards Grid (3 Columns)
    function renderProducts(category) {
        const grid = document.getElementById('products-grid-container');

        let filtered = productsData;
        if (category !== 'ALL') {
            filtered = productsData.filter(item => item.category === category);
        }

        // Clear grid
        grid.innerHTML = '';

        if (filtered.length === 0) {
            grid.innerHTML = `
                <div class="col-span-1 sm:col-span-2 md:col-span-3 text-center py-20 text-outline">
                    <p class="text-lg">해당 카테고리의 제품이 없습니다.</p>
                </div>
            `;
            return;
        }

        // Populate Cards (3-column grid layout)
        filtered.forEach(product => {
            const card = document.createElement('div');
            card.className = 'group cursor-pointer flex flex-col justify-between mb-4 sm:mb-6';
            
            card.innerHTML = `
                <div>
                    <!-- Image Box Container -->
                    <div class="relative h-[200px] sm:h-[240px] md:h-[280px] bg-[#f9f8f6] rounded-md overflow-hidden flex items-center justify-center p-4 mb-4 transition-colors group-hover:bg-[#f2f0eb]">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-contain transition-transform duration-500 group-hover:scale-105">
                    </div>

                    <!-- Title & Price -->
                    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-baseline gap-1 mb-2">
                        <h3 class="text-base sm:text-lg font-medium text-primary group-hover:text-primary/80 transition-colors font-display tracking-tight">${product.name}</h3>
                        <span class="text-sm sm:text-base font-semibold text-primary whitespace-nowrap">${product.price}</span>
                    </div>

                    <!-- Description -->
                    <p class="text-xs sm:text-sm text-on-surface-variant leading-relaxed line-clamp-2">${product.desc}</p>
                </div>
            `;

            // Card click action
            card.onclick = () => {
                showToast(`${product.name} 상세 페이지 선택 (${product.category})`);
            };

            grid.appendChild(card);
        });
    }

    // Filter Category Handler
    function filterCategory(cat) {
        currentCategory = cat;

        // Update tab styles
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('tab-active');
            btn.classList.add('tab-inactive');
        });

        const activeBtn = document.getElementById(`tab-btn-${cat}`);
        if (activeBtn) {
            activeBtn.classList.remove('tab-inactive');
            activeBtn.classList.add('tab-active');
        }

        renderProducts(cat);
    }

    // Toast Notification helper
    function showToast(msg) {
        const container = document.getElementById('toast-container');
        const messageEl = document.getElementById('toast-message');
        if (!container || !messageEl) return;

        messageEl.textContent = msg;
        container.classList.remove('hidden');
        container.classList.add('toast-animate');

        setTimeout(() => {
            container.classList.add('hidden');
            container.classList.remove('toast-animate');
        }, 2800);
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
        renderProducts('ALL');
    });
